<!-- CRT MONITOR -->
<g transform="translate(380, 130)">
  <rect x="0" y="0" width="160" height="130" fill="#222" stroke="#444" stroke-width="2"/>
  <rect x="4" y="4" width="152" height="122" fill="#111"/>
  <rect x="10" y="10" width="140" height="110" fill="#0a1a0a"/>
  <!-- Code -->
  <text x="14" y="26" font-family="Courier New,monospace" font-size="8" fill="#c586c0">import</text>
  <text x="44" y="26" font-family="Courier New,monospace" font-size="8" fill="#7ec87e"> React </text>
  <text x="76" y="26" font-family="Courier New,monospace" font-size="8" fill="#c586c0">from</text>
  <text x="100" y="26" font-family="Courier New,monospace" font-size="8" fill="#ce9178">'react'</text>
  <text x="14" y="38" font-family="Courier New,monospace" font-size="8" fill="#c586c0">import</text>
  <text x="44" y="38" font-family="Courier New,monospace" font-size="8" fill="#7ec87e"> Head </text>
  <text x="72" y="38" font-family="Courier New,monospace" font-size="8" fill="#c586c0">from</text>
  <text x="96" y="38" font-family="Courier New,monospace" font-size="8" fill="#ce9178">'next/head'</text>
  <text x="14" y="52" font-family="Courier New,monospace" font-size="8" fill="#c586c0">const</text>
  <text x="40" y="52" font-family="Courier New,monospace" font-size="8" fill="#7ec87e"> App = () =&gt; {</text>
  <text x="18" y="64" font-family="Courier New,monospace" font-size="8" fill="#7ec87e">  return (</text>
  <text x="22" y="76" font-family="Courier New,monospace" font-size="8" fill="#7ec87e">    &lt;div&gt;</text>
  <text x="26" y="88" font-family="Courier New,monospace" font-size="8" fill="#7ec87e">      code</text>
  <text x="26" y="100" font-family="Courier New,monospace" font-size="8" fill="#7ec87e">      with mood</text>
  <text x="18" y="112" font-family="Courier New,monospace" font-size="8" fill="#7ec87e">    &lt;/div&gt;</text>
  <text x="14" y="114" font-family="Courier New,monospace" font-size="8" fill="#7ec87e">}</text>
  <rect x="106" y="98" width="4" height="10" fill="#7ec87e" class="cursor"/>
  <rect x="10" y="10" width="140" height="110" fill="#4ade80" opacity=".03"/>
</g>

