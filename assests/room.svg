<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" shape-rendering="crispEdges">
<style>
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes scan{from{transform:translateY(0)}to{transform:translateY(4px)}}
@keyframes flicker{0%,19%,21%,23%,25%,54%,56%,100%{opacity:1}20%,24%,55%{opacity:.3}}
@keyframes tape{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes eq{0%,100%{height:8px}50%{height:20px}}
@keyframes boot{from{width:0}to{width:180px}}
.glow{animation:glow 2s ease-in-out infinite}
.cursor{animation:blink .8s step-end infinite}
.scan{animation:scan .1s linear infinite}
.tape{animation:tape 3s linear infinite;transform-origin:center}
.float{animation:float 3s ease-in-out infinite}
.eq1{animation:eq .6s ease-in-out infinite}
.eq2{animation:eq .8s ease-in-out infinite}
.eq3{animation:eq .5s ease-in-out infinite}
.eq4{animation:eq .7s ease-in-out infinite}
.boot{animation:boot 2s ease-in-out forwards;overflow:hidden;white-space:nowrap}
</style>

