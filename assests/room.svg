<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" shape-rendering="crispEdges">
<style>
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes tape{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.glow{animation:glow 2s ease-in-out infinite}
.cursor{animation:blink .8s step-end infinite}
.tape{animation:tape 2s linear infinite;transform-origin:center}
.float{animation:float 3s ease-in-out infinite}
</style>

