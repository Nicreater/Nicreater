  <text x="65" y="130" font-family="'Courier New',monospace" font-size="13" font-weight="bold" fill="#7ec8e3" text-anchor="middle">CHUNGKING</text>
  <text x="65" y="146" font-family="'Courier New',monospace" font-size="10" fill="#ff6ec7" opacity=".8" text-anchor="middle">EXPRESS</text>
  <text x="65" y="160" font-family="'Courier New',monospace" font-size="8" fill="#aaa" opacity=".5" text-anchor="middle">1994</text>
</g>

<!-- POSTER 2 - In the Mood for Love -->
<g filter="url(#poster-shadow)" transform="translate(440, 55)">
  <rect width="130" height="190" fill="#1a0a0a" rx="3"/>
  <rect x="3" y="3" width="124" height="184" fill="#2d0d0d" rx="2"/>
