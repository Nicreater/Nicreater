  <text class="code-kw" x="480" y="288">import</text><text class="code"> &#123; retro &#125; </text><text class="code-kw">from</text><text class="code-str"> './vibes'</text>
  <text class="code code-kw" x="480" y="306">const</text><text class="code"> App = </text><text class="code-kw">() =&gt;</text><text class="code"> &#123;</text>
  <text class="code code-kw" x="490" y="322">  const</text><text class="code"> [mood] = useState(</text><text class="code-str">'wkw'</text><text class="code">)</text>
  <text class="code code-kw" x="490" y="338">  return</text><text class="code"> (</text>
  <text class="code" x="500" y="354">    &lt;div className=</text><text class="code-str">"dream"</text><text class="code">&gt;</text>
  <text class="code" x="510" y="370">      &amp;#10038; in the mood for code &amp;#10038;</text>
  <text class="code" x="480" y="386">&#125;</text>
