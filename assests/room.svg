<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<style>
@keyframes blink{0%,100%{opacity:1}50%{opacity:.6}}
@keyframes rain{from{transform:translateY(-30px)}to{transform:translateY(30px)}}
@keyframes glow{0%,100%{opacity:.6;filter:drop-shadow(0 0 8px currentColor)}50%{opacity:1;filter:drop-shadow(0 0 16px currentColor)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{opacity:.85}50%{opacity:1}}
@keyframes cursor{0%,100%{opacity:1}50%{opacity:0}}
@keyframes neonflicker{0%,19%,21%,23%,25%,54%,56%,100%{opacity:1}20%,24%,55%{opacity:.3}}
@keyframes tape{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes eq1{0%,100%{height:15px;y:20px}50%{height:25px;y:10px}}
@keyframes eq2{0%,100%{height:20px;y:15px}50%{height:10px;y:25px}}
@keyframes eq3{0%,100%{height:25px;y:10px}50%{height:15px;y:20px}}
@keyframes particle{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:.7;transform:translateY(-10px)}}
.wall-bg{fill:#1a1c23}
.floor-bg{fill:#121318}
.window-frame{fill:#2a2d35;stroke:#3a3d45;stroke-width:2}
.window-glass{fill:#0a1628}
.desk-top{fill:#5d4037}
.desk-leg{fill:#4e342e}
.monitor-body{fill:#1e1e1e;stroke:#333;stroke-width:2}
.screen-bg{fill:#0d1b0d}
.code{fill:#7ec87e;font-family:'Courier New',monospace;font-size:11px}
.code-kw{fill:#c586c0;font-family:'Courier New',monospace;font-size:11px}
.code-str{fill:#ce9178;font-family:'Courier New',monospace;font-size:11px}
.cursor-b{fill:#7ec87e;animation:cursor 1s step-end infinite}
.neon{animation:glow 2s ease-in-out infinite;color:#ff6ec7}
.neon-blue{animation:glow 2.5s ease-in-out infinite;color:#00d4ff}
.neon-orange{animation:glow 1.8s ease-in-out infinite;color:#ff8c00}
.rain{animation:rain .8s linear infinite}
.rain-d{animation:rain 1.2s linear infinite}
.cassette{animation:breathe 3s ease-in-out infinite}
.tape-reel{animation:tape 3s linear infinite;transform-origin:center}
.eq-r1{animation:eq1 1.2s ease-in-out infinite}
.eq-r2{animation:eq2 1s ease-in-out infinite}
.eq-r3{animation:eq3 1.4s ease-in-out infinite}
.eq-r4{animation:eq2 .9s ease-in-out infinite}
.eq-r5{animation:eq1 1.1s ease-in-out infinite}
.p1{animation:particle 4s ease-in-out infinite}
.p2{animation:particle 5s ease-in-out infinite;animation-delay:1s}
.p3{animation:particle 3.5s ease-in-out infinite;animation-delay:2s}
.p4{animation:particle 4.5s ease-in-out infinite;animation-delay:.5s}
</style>

<defs>
  <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" opacity=".15"/>
  </pattern>
  <filter id="poster-shadow">
    <feDropShadow dx="3" dy="4" stdDeviation="4" flood-color="#000" flood-opacity=".6"/>
  </filter>
</defs>

<!-- Background -->
<rect class="wall-bg" width="1200" height="470"/>
<rect class="floor-bg" x="0" y="470" width="1200" height="230"/>
<line x1="0" y1="470" x2="1200" y2="470" stroke="#2a2d35" stroke-width="1"/>

<!-- Window - left wall (Wong Kar-wai rainy aesthetic) -->
<rect class="window-frame" x="40" y="40" width="220" height="200" rx="4"/>
<rect class="window-glass" x="45" y="45" width="210" height="190"/>
<line x1="150" y1="45" x2="150" y2="235" stroke="#2a2d35" stroke-width="2"/>
<line x1="45" y1="140" x2="255" y2="140" stroke="#2a2d35" stroke-width="2"/>

<!-- City silhouette in window -->
<polygon points="45,235 70,190 90,210 110,170 130,190 150,160 170,200 190,180 210,210 255,235" fill="#0a1220" opacity=".7"/>
<polygon points="45,235 60,150 75,170 85,140 100,160 120,130 140,155 160,145 180,165 200,150 220,170 255,235" fill="#0d1a2a" opacity=".5"/>
<circle cx="110" cy="160" r="3" fill="#ff6ec7" class="neon"/>
<circle cx="180" cy="145" r="2" fill="#00d4ff" class="neon-blue"/>

<!-- Rain -->
<g class="rain" stroke="#7fc7ff" stroke-width="1" opacity=".6">
<line x1="60" y1="50" x2="55" y2="70"/>
<line x1="90" y1="60" x2="85" y2="80"/>
<line x1="120" y1="45" x2="115" y2="65"/>
<line x1="160" y1="70" x2="155" y2="90"/>
<line x1="200" y1="55" x2="195" y2="75"/>
<line x1="230" y1="65" x2="225" y2="85"/>
</g>
<g class="rain-d" stroke="#7fc7ff" stroke-width="1" opacity=".4">
<line x1="75" y1="50" x2="70" y2="70"/>
<line x1="140" y1="60" x2="135" y2="80"/>
<line x1="190" y1="45" x2="185" y2="65"/>
</g>

<!-- Neon sign "CODING" -->
<g transform="translate(600, 30)">
