  <text x="65" y="146" font-family="'Courier New',monospace" font-size="10" fill="#e8a87c" text-anchor="middle">FOR LOVE</text>
  <text x="65" y="160" font-family="'Courier New',monospace" font-size="8" fill="#aaa" opacity=".5" text-anchor="middle">2000</text>
</g>

